<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D71920" />
      <stop offset="100%" stop-color="#F1262D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem / Geometric Custom Wheel Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer rim -->
    <circle cx="30" cy="30" r="28" stroke="url(#chromeGrad)" stroke-width="3" fill="#111317" />
    <circle cx="30" cy="30" r="23" stroke="#292D34" stroke-width="1.5" fill="none" />
    <!-- Wheel Spokes -->
    <path d="M30 7 L30 53 M7 30 L53 30 M14 14 L46 46 M14 46 L46 14" stroke="url(#chromeGrad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Center Hub with Red Chicago Star -->
    <circle cx="30" cy="30" r="9" fill="#08090B" stroke="#D71920" stroke-width="2" />
    <!-- 6-Point Chicago Star in Center -->
    <polygon points="30,24 32,28 36,28 33,30 34,34 30,32 26,34 27,30 24,28 28,28" fill="#D71920" />
  </g>

  <!-- Typography -->
  <g transform="translate(82, 16)">
    <!-- CHI-TOWN -->
    <text x="0" y="32" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="3" fill="url(#chromeGrad)">
      CHI-TOWN
    </text>
    
    <!-- Red Accent Slanted Slash -->
    <polygon points="214,10 224,10 216,34 206,34" fill="url(#redGrad)" />

    <!-- CUSTOMS USA Subtitle -->
    <text x="0" y="52" font-family="'Montserrat', 'Arial', sans-serif" font-size="12" font-weight="800" letter-spacing="7" fill="#A4A8B0">
      CUSTOMS
    </text>
    <rect x="94" y="42" width="42" height="13" rx="2" fill="#D71920" />
    <text x="98" y="52" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="10" font-weight="900" letter-spacing="2" fill="#FFFFFF">
      USA
    </text>
  </g>
</svg>
